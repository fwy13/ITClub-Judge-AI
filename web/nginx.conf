server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 # CSV submissions are still limited to 10 MB by the API. The larger proxy
 # allowance is for administrator competition datasets (100 MB plus multipart overhead).
 client_max_body_size 105m;
 location /api/ {proxy_pass http://auth-api:4000;proxy_set_header Host $host;proxy_set_header X-Real-IP $remote_addr;proxy_read_timeout 180s;}
 location /ws {proxy_pass http://auth-api:4000;proxy_http_version 1.1;proxy_set_header Upgrade $http_upgrade;proxy_set_header Connection "upgrade";proxy_read_timeout 3600s;}
 location / {try_files $uri $uri/ /index.html;}
}
